<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team 19 - Pizza Game</title>
  </head>
  
  <!-- CSS Code (not in it's own file, maybe will do later)-->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f2d7d6;
      font-family: Georgia, "Times New Roman", serif;
    }
    #container {
      width: min(900px, 100%);
      min-height: 540px;
      padding: 50px 10%;
      border: 7px solid #b87954;
      outline: 3px solid #dba7a7;
      /* To make a background with the little circles */
      background:
        radial-gradient(circle, rgb(184 121 84 / 15%) 1px, transparent 1.5px) 0 0 / 12px 12px,
        #fbe8a6;
      box-shadow: 0 8px 24px rgb(60 35 25 / 15%);
    }
    .top-label {
      text-align: center;
    }
    h1 {
      margin: 8px 0 36px;
      text-align: center;
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 span {
      font-size: 0.55em;
      vertical-align: 15%;
    }
    .game-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }
    .menu {
      width: 280px;
    }
    h2 {
      margin: 6px 0 18px;
      color: #c85f50;
      font-size: 28px;
      font-weight: 400;
    }
    /* Buttons for the games */
    .game-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 5px;
      border: 0;
      background: transparent;
      color: #33231f;
      text-align: left;
      cursor: pointer;
    }
    .game-button:hover,
    .game-button:focus-visible {
      background: rgb(184 121 84 / 15%);
      outline: 1px solid #b87954;
    }
    .game-number {
      font-size: 10px;
    }
    .game-button strong,
    .game-button small {
      display: block;
    }
    .game-button strong {
      color: #51479a;
      font: 13px Arial, sans-serif;
    }
    .game-button small {
      margin-top: 3px;
      color: #80695e;
      font: 10px Arial, sans-serif;
    }
    .tutorial-button {
      margin: 12px 0 0 24px;
      padding: 10px 13px;
      border: 0;
      border-radius: 3px;
      background: #51479a;
      color: white;
      font: 12px Arial, sans-serif;
      cursor: pointer;
    }
    .tutorial-button:hover,
    .tutorial-button:focus-visible {
      background: #39316f;
      outline: 2px solid white;
    }
    .status {
      min-height: 18px;
      margin: 9px 0 0 24px;
      color: #76503b;
      font: 12px Arial, sans-serif;
    }
    /* If the device is narrower than 520 px */
    @media (max-width: 520px) {
      #container {
        padding: 35px 7%;
      }
      .game-content {
        align-items: flex-start;
      }
    }
  </style>
  
  <body>
    <main id="container" class="game-card">
      <h1>Pizza Game<span aria-hidden="true">🍕</span></h1>
      <section class="game-content">
        <div class="menu">
          <h2>Click to play!!</h2>
          <!-- Buttons -->
          <button class="game-button" data-game="Main game">
            <span class="game-number">01</span>
            <span><strong>Main game</strong><small>Start the Dinner Rush</small></span>
          </button>
          <button class="game-button" data-game="Stock supply">
            <span class="game-number">02</span>
            <span><strong>Stock supply</strong><small>Check your Ingredients</small></span>
          </button>
          <button class="game-button" data-game="Oven Timer">
            <span class="game-number">03</span>
            <span><strong>Oven timer</strong><small>Practice Perfect Timing</small></span>
          </button>
          <button id="tutorial-button" class="tutorial-button">
            ▶ Interactive tutorial
          </button>
          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
