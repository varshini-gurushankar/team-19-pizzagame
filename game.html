<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Rush</title>

  <style>
    * {
      box-sizing: border-box;
    }

    /* background */
    body {
      margin: 0;
      background: #fff8e5;
    }

    /* title area */
    header {
      height: 73px;
      background: #e3d1d1;
      border-bottom: 3px solid #d88b9c;
    }

    main {
      display: grid;

      /* three columns */
      grid-template-columns: 
      minmax(220px, 1fr) 
      minmax(400px, 1.8fr) 
      minmax(260px, 1.05fr);

      gap: 28px;
      padding: 30px 24px;
      align-items: start;
    }

    /* pizza choose toppings area  */
    .pizza-panel {
      min-height: 745px;
      background: #fffdf4;
      border: 3px solid #34251e;
      padding: 34px;
    }

    /* order details area */
    .order-panel {
      min-height: 620px;
      background: #fae7a5;
      border: 3px solid #34251e;
      padding: 30px;
    }

    /* customer box area */
    .customer {
        height: 124px;
        background: #fffdf4;
        border: 2px solid #ff0000;
        padding: 15px;
        margin-bottom: 14px;
    }

    /* customer patience meter */
    .patience-container {
        margin-top: 12px;
    }

    .patience-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: bold;
        color: #34251e;
    }

    .patience-bar {
        width: 100%;
        height: 20px;
        background: #e5d8d2;
        border: 2px solid #34251e;
        border-radius: 10px;
        overflow: hidden;
    }

    #patience-fill {
        width: 100%;
        height: 100%;
        background: #65b979;
        transition: width 0.1s linear;
    }

    /* earning box area */
    .earnings {
        height: 146px;
        margin-top: 28px;
        border: 2px solid #34251e;
        background: #fae7a5;
    }

    /* "CUT INTO X SLICES" text*/
    .slice-control label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #34251e;
      text-align: center; 
    }

    /* The num in ^^^ label */
    #slice-count {
      color:#4a3fa0;
      font-size: 1.3em;
    }

    /* slider */
    #slice-slider {
      width: 100%;
      accent-color: #4a3fa0;  
    }

    /* num indicators for slider */
    .slice-ticks {
      display: flex;
      justify-content: space-between;
      padding: 0px 5px;
      font-size: 13px;
      color: #4a3fa0;
      font-weight: bold;
    }

    /* gap in between each num indictaor for slider */
    .slice-ticks span {
      width: 0px;                
      display: flex;
      justify-content: center;
    }

  </style>
</head>
<body>
  <header></header>
  <main>
    <!-- puts customer box and earnings box in left column -->
    <section class="left-column">

  <div class="customer">

    <div class="patience-container">
      <!-- put patience meter in customer box and in left column -->
      <div class="patience-label">
        <span>Customer Patience</span>
        <span id="patience-time">60s</span>
      </div>

      <div class="patience-bar">
        <div id="patience-fill"></div>
      </div>

    </div>
  </div>

  <div class="earnings"></div>

</section>
    <!-- in the pizza panel box -->
    <section class="pizza-panel">

        <div id="pizza-container"></div> 
        <!-- placeholder for konva pizza -->

        <!-- slice control area -->
        <div class="slice-control">

          <!-- "CUT INTO 1 SLICE" text by default -->
          <label for="slice-slider">
            CUT INTO <span id="slice-count">1</span> <span id="slice-word">SLICE</span>
          </label>

          <!-- slider -->
          <input type="range" id="slice-slider" min="1" max="10" step="1" value="1">

          <!-- num indicators for the slider -->
          <div class="slice-ticks">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
          </div>

        </div>

    </section>
    <section class="order-panel"></section>
  </main>

  <!-- implement typescript for pizzaAssembly -->
  <script type="module" src="/src/pizzaAssembly.ts"></script>
  <script type="module" src="/src/game.ts"></script>
</body>
</html>
