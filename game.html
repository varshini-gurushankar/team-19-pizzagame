<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Rush</title>

  <style>
    * {
      box-sizing: border-box;
    }

    /* background */
    body {
      margin: 0;
      background: #fff8e5;
    }

    /* title area */
    header {
      height: 73px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 28px;
      background: #e3d1d1;
      border-bottom: 3px solid #d88b9c;
    }

    #current-day {
      margin: 0;
      font: bold 22px Arial, sans-serif;
      color: #34251e;
    }

    main {
      display: grid;

      /* three columns */
      grid-template-columns: 
      minmax(220px, 1fr) 
      minmax(400px, 1.8fr) 
      minmax(260px, 1.05fr);

      gap: 28px;
      padding: 30px 24px;
      align-items: start;
    }

    /* pizza choose toppings area  */
    .pizza-panel {
      min-height: 745px;
      background: #fffdf4;
      border: 3px solid #34251e;
      padding: 34px;
    }

    /* order details area */
    .order-panel {
      min-height: 620px;
      background: #fae7a5;
      border: 3px solid #34251e;
      padding: 30px;
    }

    /* customer box area */
    .customer {
        background: #fffdf4;
        border: 2px solid #ff0000;
        padding: 15px;
        margin-bottom: 14px;
    }

    .customer-list {
        max-height: 76vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .order-details {
        margin: 12px 0 0;
        font-size: 16px;
        line-height: 1.4;
        color: #34251e;
    }

    .customer.active {
        outline: 3px solid #34251e;
    }

    .customer.done,
    .customer.left {
        opacity: 0.55;
    }

    #day-score {
        margin: 12px 0 0;
        font-weight: bold;
        color: #34251e;
    }

    #next-day {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #49834d;
        color: white;
        font: bold 16px Arial, sans-serif;
        cursor: pointer;
    }

    /* customer patience meter */
    .patience-container {
        margin-top: 12px;
    }

    .patience-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: bold;
        color: #34251e;
    }

    .patience-bar {
        width: 100%;
        height: 20px;
        background: #e5d8d2;
        border: 2px solid #34251e;
        border-radius: 10px;
        overflow: hidden;
    }

    .patience-fill {
        width: 100%;
        height: 100%;
        background: #65b979;
        transition: width 0.1s linear;
    }

    /* "CUT INTO X SLICES" text*/
    .slice-control label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #34251e;
      text-align: center; 
    }

    /* konva pizza */
    #pizza-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* The num in ^^^ label */
    #slice-count {
      color:#4a3fa0;
      font-size: 1.3em;
    }

    /* slider */
    #slice-slider {
      width: 100%;
      accent-color: #4a3fa0;  
    }

    /* num indicators for slider */
    .slice-ticks {
      display: flex;
      justify-content: space-between;
      padding: 0px 5px;
      font-size: 13px;
      color: #4a3fa0;
      font-weight: bold;
    }

    /* gap in between each num indictaor for slider */
    .slice-ticks span {
      width: 0px;                
      display: flex;
      justify-content: center;
    }

    /* centering the button */
    .serve-btn {
      display: block;
      margin: 20px auto 0;
      padding: 20px 30px;
      border: none;
      border-radius: 8px;
      background: #49834d;
      color: white;
      font: bold 18px Arial, sans-serif;
      cursor: pointer;
      transition: background-color 0.5s ease, padding 0.5s ease; 
    }

    /* hover effect for the button */
    .serve-btn:hover {
      background-color: #286c47;
      padding:23px 33px;
    }


    /* konva pizza */
    #pizza-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    
    /* toppings container */
    #toppings-container {
      width: 100%;
      height: 300px;
      margin-top: 300px;
      margin-bottom: 10px;
    }

    /* undo button */
    #undo-button {
      display: block;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #49834d;
      color: white;
      font: bold 18px Arial, sans-serif;
      cursor: pointer;
      transition: background-color 0.5s ease, padding 0.5s ease;
      left: 40px;
    }

    .score-tracker {
      text-align: right;
      font: bold 18px Arial, sans-serif;
    }

    .score-tracker p { 
      margin: 0; 
      padding:5px;
      
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @keyframes score-pop-right {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.5); color: #53c35b; }
    }

    @keyframes score-pop-wrong {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.5); color: #ff1900; }
    }

    .score-pop-right {
      display: inline-block;
      animation: score-pop-right 1.5s ease-out;
    }

    .score-pop-wrong {
      display: inline-block;
      animation: score-pop-wrong 1.5s ease-out;
    }

    @keyframes cash-pop-right {
      50% { transform: scale(1.5); color: #53c35b; }
    }

    @keyframes cash-pop-wrong {
      50% { transform: scale(1.5); color: #ff1900; }
    }

    .cash-pop-right {
      display: inline-block;
      animation: cash-pop-right 1.5s ease-out;
    }

    .cash-pop-wrong {
      display: inline-block;
      animation: cash-pop-wrong 1.5s ease-out;
    }

  </style>
</head>
<body>
  <header>
    <p id="current-day">Day 1</p>
  </header>
  <main>
    <!-- puts customer box and earnings box in left column -->
    <section class="left-column">

  <div id="customer-list" class="customer-list"></div>
  <p id="day-score"></p>
  <button id="next-day" type="button" hidden>Next day</button>

</section>
    <!-- in the pizza panel box -->
    <section class="pizza-panel">

        <!-- score tracker  -->
        <div class="tools">
          <!-- Undo Button -->
          <button id="undo-button" type="button">Undo</button>

          <div class="score-tracker">
            <p>Score: <span id="score">0</span></p>
            <p>Earnings: $<span id="cash">0</span></p>
          </div>
        </div>

        <div id="pizza-container"></div>

        <!-- slice control area -->
        <div class="slice-control">

          <!-- "CUT INTO 1 SLICE" text by default -->
          <label for="slice-slider">
            CUT INTO <span id="slice-count">1</span> <span id="slice-word">SLICE</span>
          </label>

          <!-- slider -->
          <input type="range" id="slice-slider" min="1" max="10" step="1" value="1">

          <!-- num indicators for the slider -->
          <div class="slice-ticks">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
          </div>
        </div>

    </section>
    <section class="order-panel">
      
      <h2>Current Order</h2>
      <div id="active-order"></div>
      
      <!-- Serve Button -->
      <div class="complete-order">
        <button class="serve-btn" id = "serve-btn" type="button">Serve Pizza</button>
      </div>
    </section>
  </main>

  <dialog id="success">
    <h2>Congrats!</h2>
    <p>The order was successful!</p>
    <button id="success-continue" type="button">Continue</button>
  </dialog>

  <dialog id="fail">
    <h2>Oh No!</h2>
    <p>The order was incorrect.</p>
    <button id="fail-continue" type="button">Continue</button>
  </dialog>

  <dialog id="week">
    <h2>Two days done</h2>
    <p id="week-summary"></p>
    <button id="week-menu" type="button">Back to menu</button>
  </dialog>

  <script type="module">
    import { startGame } from "/src/game/GameController.ts";
    startGame();
  </script>
  
</body>
</html>
